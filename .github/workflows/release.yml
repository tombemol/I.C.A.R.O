name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust Android targets
        if: steps.check.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install
        if: steps.check.outputs.exists == 'false'
        run: npm install

      - name: Install Android NDK r28
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Initialize Android project
        if: steps.check.outputs.exists == 'false'
        run: npm run android:init

      - name: Build Android APK
        if: steps.check.outputs.exists == 'false'
        run: npm run android:build -- --debug

      - name: Verify 16 KiB native alignment
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          LIB="/tmp/libicaro_lib.so"
          unzip -p "$APK" "lib/arm64-v8a/libicaro_lib.so" > "$LIB"
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" -p "$LIB" | tee /tmp/icaro-load-segments.txt
          if awk '/^[[:space:]]*LOAD / && $0 !~ /align 2\*\*(14|15|16)/ { bad=1 } END { exit bad }' /tmp/icaro-load-segments.txt; then
            echo "ARM64 native library is compatible with 16 KiB pages."
          else
            echo "Native library contains LOAD segments below 16 KiB alignment."
            exit 1
          fi

      - name: Prepare release asset
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          SOURCE="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          TARGET="I.C.A.R.O-v${VERSION}-android-debug.apk"
          test -f "$SOURCE"
          cp "$SOURCE" "$TARGET"
          echo "APK_PATH=$TARGET" >> "$GITHUB_ENV"

      - name: Write release notes
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## I.C.A.R.O. v${VERSION}

          Hotfix de compatibilidade Android do I.C.A.R.O.

          ### Destaques
          - Corrige falha de abertura em aparelhos Android 15+ com páginas de memória de 16 KiB
          - Biblioteca Rust/ARM64 vinculada explicitamente com alinhamento compatível
          - Build fixado no Android NDK r28
          - CI e release agora validam os segmentos LOAD do binário antes de publicar o APK
          - Health Connect e progressão da 0.4.0 preservados

          ### Android
          O arquivo anexado é um **APK universal de debug**, destinado a testes da versão atual em aparelhos Android.

          > Esta build ainda não é uma distribuição assinada de produção/Play Store.
          EOF

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" "$APK_PATH#I.C.A.R.O. v$VERSION - Android APK (debug)" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "I.C.A.R.O. v$VERSION" \
            --notes-file RELEASE_NOTES.md
