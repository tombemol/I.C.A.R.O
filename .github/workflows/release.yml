name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust Android targets
        if: steps.check.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install
        if: steps.check.outputs.exists == 'false'
        run: npm install

      - name: Install Android NDK r28
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Initialize Android project
        if: steps.check.outputs.exists == 'false'
        run: npm run android:init

      - name: Build Android APK
        if: steps.check.outputs.exists == 'false'
        run: npm run android:build -- --debug

      - name: Verify Android package compatibility
        shell: bash
        run: |
          set -euo pipefail

          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          PROPS="src-tauri/gen/android/gradle.properties"
          OBJDUMP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"

          test -f "$APK"
          grep -Fq 'ndkVersion = "28.2.13676358"' "$GRADLE"
          grep -Fq 'useLegacyPackaging = false' "$GRADLE"
          grep -Fq 'android.enableR8.fullMode=false' "$PROPS"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign -print | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          mapfile -t LIBS < <(unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*\.so$')
          test "${#LIBS[@]}" -gt 0

          rm -rf /tmp/icaro-arm64
          mkdir -p /tmp/icaro-arm64

          for ENTRY in "${LIBS[@]}"; do
            FILE="/tmp/icaro-arm64/$(basename "$ENTRY")"
            unzip -p "$APK" "$ENTRY" > "$FILE"
            LOADS="$("$OBJDUMP" -p "$FILE" | grep '^[[:space:]]*LOAD ' || true)"
            printf '\n[%s]\n%s\n' "$ENTRY" "$LOADS"

            test -n "$LOADS"
            if printf '%s\n' "$LOADS" | grep -Eq 'align 2\*\*([0-9]|1[0-3])([^0-9]|$)'; then
              echo "::error::Native library $ENTRY contains LOAD segments below 16 KiB alignment."
              exit 1
            fi
          done

          echo "APK ZIP alignment and all ARM64 native libraries are compatible with 16 KiB pages."
      - name: Prepare release asset
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          SOURCE="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          TARGET="I.C.A.R.O-v${VERSION}-android-debug.apk"
          test -f "$SOURCE"
          cp "$SOURCE" "$TARGET"
          echo "APK_PATH=$TARGET" >> "$GITHUB_ENV"

      - name: Write release notes
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## I.C.A.R.O. v${VERSION}

          Hotfix de compatibilidade Android do I.C.A.R.O.

          ### Destaques
          - Corrige falha de abertura em aparelhos Android 15+ com páginas de memória de 16 KiB
          - Biblioteca Rust/ARM64 vinculada explicitamente com alinhamento compatível
          - Build fixado no Android NDK r28
          - CI e release agora validam os segmentos LOAD do binário antes de publicar o APK
          - Health Connect e progressão da 0.4.0 preservados

          ### Android
          O arquivo anexado é um **APK universal de debug**, destinado a testes da versão atual em aparelhos Android.

          > Esta build ainda não é uma distribuição assinada de produção/Play Store.
          EOF

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" "$APK_PATH#I.C.A.R.O. v$VERSION - Android APK (debug)" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "I.C.A.R.O. v$VERSION" \
            --notes-file RELEASE_NOTES.md
