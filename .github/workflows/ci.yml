name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install
        run: npm install

      - name: Install Android NDK r28
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: npm run android:init

      - name: Android debug build
        run: npm run android:build -- --debug

      - name: Verify Android package compatibility
        shell: bash
        run: |
          set -euo pipefail

          APK="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          PROPS="src-tauri/gen/android/gradle.properties"
          OBJDUMP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"

          test -f "$APK"
          grep -Fq 'ndkVersion = "28.2.13676358"' "$GRADLE"
          grep -Fq 'useLegacyPackaging = false' "$GRADLE"
          grep -Fq 'android.enableR8.fullMode=false' "$PROPS"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign -print | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          mapfile -t LIBS < <(unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*\.so$')
          test "${#LIBS[@]}" -gt 0

          rm -rf /tmp/icaro-arm64
          mkdir -p /tmp/icaro-arm64

          for ENTRY in "${LIBS[@]}"; do
            FILE="/tmp/icaro-arm64/$(basename "$ENTRY")"
            unzip -p "$APK" "$ENTRY" > "$FILE"
            LOADS="$("$OBJDUMP" -p "$FILE" | grep '^[[:space:]]*LOAD ' || true)"
            printf '\n[%s]\n%s\n' "$ENTRY" "$LOADS"

            test -n "$LOADS"
            if printf '%s\n' "$LOADS" | grep -Eq 'align 2\*\*([0-9]|1[0-3])([^0-9]|$)'; then
              echo "::error::Native library $ENTRY contains LOAD segments below 16 KiB alignment."
              exit 1
            fi
          done

          echo "APK ZIP alignment and all ARM64 native libraries are compatible with 16 KiB pages."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: icaro-0.4.2-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
